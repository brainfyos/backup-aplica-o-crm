<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Conexão Meta · Vendus</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7f8; color: #17211b; }
      main { width: min(420px, calc(100% - 40px)); padding: 32px; border: 1px solid #dfe5e1; border-radius: 16px; background: white; box-shadow: 0 18px 50px #10201818; }
      h1 { margin: 0 0 10px; font-size: 22px; }
      p { margin: 0; color: #5d6a62; line-height: 1.5; overflow-wrap: anywhere; }
      .error h1 { color: #b42318; }
      @media (prefers-color-scheme: dark) {
        body { background: #101512; color: #edf4ef; }
        main { background: #18201b; border-color: #2b3930; }
        p { color: #aab9af; }
      }
    </style>
  </head>
  <body>
    <main id="card">
      <h1 id="title">Finalizando conexão…</h1>
      <p id="message">Aguarde enquanto voltamos ao Vendus.</p>
    </main>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const status = params.get('status') || 'error';
        const sessionId = params.get('session_id');
        const error = params.get('error') || 'Não foi possível concluir a conexão.';
        const payload = { source: 'meta-oauth', status };
        if (sessionId) payload.session_id = sessionId;
        if (status !== 'ready') payload.error = error;

        if (status === 'ready') {
          document.getElementById('title').textContent = 'Conta autorizada';
          document.getElementById('message').textContent = 'Voltando ao Vendus para você escolher as contas…';
        } else {
          document.getElementById('card').classList.add('error');
          document.getElementById('title').textContent = 'Não foi possível conectar';
          document.getElementById('message').textContent = error;
        }

        const returnUrl = new URL('/admin', window.location.origin);
        returnUrl.searchParams.set('tab', 'connections');
        if (status === 'ready' && sessionId) {
          returnUrl.searchParams.set('meta_oauth_session', sessionId);
        } else {
          returnUrl.searchParams.set('meta_oauth_error', error);
        }

        if (window.opener) {
          try { window.opener.postMessage(payload, window.location.origin); } catch (_) {}
          setTimeout(() => {
            try { window.close(); } catch (_) {}
          }, status === 'ready' ? 900 : 3500);
        } else {
          setTimeout(() => window.location.replace(returnUrl.toString()), 650);
        }
      })();
    </script>
  </body>
</html>
